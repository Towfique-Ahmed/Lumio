<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch — Lumio</title>
  <meta name="description" content="Watch this live broadcast on Lumio and join the conversation in live chat." />
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/studio.css" />
</head>
<body class="watch-body">

  <header class="topbar">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="url(#lg)"/>
        <polygon points="13,10 23,16 13,22" fill="#fff"/>
        <defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32">
          <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/>
        </linearGradient></defs>
      </svg>
      <span>Lumio</span>
    </a>
    <div class="topbar-status">
      <span id="live-pill" class="live-pill idle"><span class="dot"></span><span id="live-label">OFFLINE</span></span>
      <span id="viewer-pill" class="viewer-pill">👁 <b id="viewer-count">0</b> watching</span>
    </div>
    <div class="topbar-actions"></div>
  </header>

  <main class="watch">
    <section class="watch-main">
      <h1 id="watch-title" class="watch-title">Live broadcast</h1>
      <div class="player-wrap">
        <video id="player" playsinline controls></video>
        <div id="player-overlay" class="player-overlay">
          <div class="overlay-card">
            <div class="pulse-ring"></div>
            <h2 id="overlay-title">Waiting for the broadcast to start…</h2>
            <p id="overlay-sub">The stream starts automatically — keep this page open.</p>
          </div>
        </div>
      </div>
    </section>

    <aside class="watch-chat">
      <div class="chat-head">Live chat</div>
      <div id="chat-list" class="chat-list"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-name" type="text" maxlength="40" placeholder="Name" autocomplete="off" />
        <input id="chat-input" type="text" maxlength="500" placeholder="Say something…" autocomplete="off" />
        <button class="btn btn-primary btn-sm" type="submit">Send</button>
      </form>
    </aside>
  </main>

  <script src="/vendor/hls.min.js"></script>
  <script src="/js/mesh.js"></script>
  <script src="/js/watch.js"></script>
</body>
</html>
