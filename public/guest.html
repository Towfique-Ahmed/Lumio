<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join the studio — Lumio</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/studio.css" />
</head>
<body class="guest-body">
  <header class="topbar">
    <a class="brand" href="#">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="url(#lg)"/>
        <polygon points="13,10 23,16 13,22" fill="#fff"/>
        <defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32">
          <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/>
        </linearGradient></defs>
      </svg>
      <span id="brand-word">Lumio <em>Studio</em></span>
    </a>
    <div class="topbar-status">
      <span id="guest-state" class="live-pill idle"><span class="dot"></span><span>BACKSTAGE</span></span>
    </div>
  </header>

  <!-- Join gate -->
  <div id="gate" class="gate">
    <div class="gate-card">
      <h1 id="welcome-h">You're invited to the <span class="grad-text">studio</span></h1>
      <p id="welcome-p">Set up your camera and mic. You'll wait in the greenroom until the host brings you on stage.</p>
      <label class="field"><span>Your name</span>
        <input id="gate-name" type="text" maxlength="40" placeholder="Your name" />
      </label>
      <div class="field-row">
        <label class="field"><span>Camera</span><select id="gate-cam"></select></label>
        <label class="field"><span>Microphone</span><select id="gate-mic"></select></label>
      </div>
      <div class="gate-preview"><video id="gate-video" autoplay playsinline muted></video></div>
      <p id="gate-error" class="gate-error hidden"></p>
      <button id="gate-enter" class="btn btn-primary btn-lg">Join studio →</button>
    </div>
  </div>

  <!-- Guest room -->
  <main id="room" class="guest-room hidden">
    <div class="guest-stage">
      <div id="guest-banner" class="guest-banner">🟡 You're backstage. The host will bring you on soon.</div>
      <div id="guest-videos" class="guest-videos"></div>
      <div class="controls guest-controls">
        <button id="btn-mic" class="ctl on">🎙<span>Mic</span></button>
        <button id="btn-cam" class="ctl on">📷<span>Cam</span></button>
        <button id="btn-screen" class="ctl">🖥<span>Share</span></button>
        <button id="btn-leave" class="ctl leave">✕<span>Leave</span></button>
      </div>
    </div>
    <aside class="sidebar guest-sidebar">
      <div class="tabs"><button class="tab on">Backstage chat</button></div>
      <section class="tab-panel">
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" type="text" maxlength="500" placeholder="Message the host…" autocomplete="off" />
          <button class="btn btn-primary btn-sm">Send</button>
        </form>
      </section>
    </aside>
  </main>

  <script src="js/media.js"></script>
  <script src="js/rtc.js"></script>
  <script src="js/guest.js"></script>
</body>
</html>
